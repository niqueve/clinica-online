services:
  db: 
    image: postgres:15-alpine
    container_name: clinica_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgres/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  web:
    build: .
    container_name: clinica_web
    restart: always
    command: ["sh", "-c", "python agenda/manage.py migrate && python agenda/manage.py createsuperuser --noinput || true && python agenda/manage.py runserver 0.0.0.0:8002"]
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: