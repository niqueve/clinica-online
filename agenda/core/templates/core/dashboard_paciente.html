<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Consultas - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Painel do Usuário</a>
            <form action="{% url 'core:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
    </nav>
    <div class="container">
        <h2>Minhas Consultas Agendadas</h2>
        <hr>
        {% if consultas %}
            <table class="table table-striped shadow bg-white rounded">
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for consulta in consultas %}
                        <tr>
                            <td>{{ consulta.data_hora }}</td>
                            <td>{{ consulta.status|default:"Agendada" }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <div class="alert alert-info">Nenhuma consulta encontrada para o seu perfil.</div>
        {% endif %}
    </div>
</body>
</html>
