<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ClínicaOn - Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .split-container { height: 75vh; min-height: 500px; }
        .split-card { width: 40%; height: 100%; }
        .illustration-bg {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 0.5rem;
            border-bottom-left-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">ClínicaOn</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#clinicas">Conheça nossas clínicas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#fale-conosco">Fale conosco</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#sobre">Sobre</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal (Tela Dividida) -->
    <main class="container my-auto py-4">
        <div class="split-container d-flex justify-content-center align-items-center shadow-lg rounded bg-white">
            
            <!-- Div Esquerda: Imagem Ilustrativa (40%) -->
            <div class="split-card illustration-bg d-none d-lg-flex flex-column p-4 text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" alt="Estetoscópio" class="img-fluid mb-3" style="max-width: 130px; opacity: 0.85;">
                <h4 class="text-primary fw-bold">Cuidando da sua Saúde</h4>
                <p class="text-muted small px-3">Agende e gerencie consultas de forma integrada e segura.</p>
            </div>

            <!-- Div Direita: Formulários Dinâmicos (40%) -->
            <div class="split-card d-flex flex-column justify-content-center p-4 p-lg-5 overflow-auto w-100" style="max-width: 480px;">
                
                <!-- ALERTA DE FEEDBACK -->
                <div id="form-alert" class="alert d-none py-2 small" role="alert"></div>

                <!-- FORMULÁRIO DE CADASTRO -->
                <div id="box-cadastro">
                    <h3 class="fw-bold mb-3 text-dark fs-4">Crie sua Conta</h3>
                    <form id="form-cadastro-ajax">
                        <div class="mb-2">
                            <label class="form-label small text-muted mb-1">Nome Completo</label>
                            <input type="text" class="form-control form-control-sm" id="cad-nome" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small text-muted mb-1">E-mail</label>
                            <input type="email" class="form-control form-control-sm" id="cad-email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted mb-1">Senha</label>
                            <input type="password" class="form-control form-control-sm" id="cad-senha" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-sm py-2">Enviar</button>
                            <button type="button" id="to-login-btn" class="btn btn-outline-secondary btn-sm py-2">Já possuo conta</button>
                        </div>
                    </form>
                </div>

                <!-- FORMULÁRIO DE LOGIN (Oculto inicialmente) -->
                <div id="box-login" class="d-none">
                    <h3 class="fw-bold mb-3 text-dark fs-4">Acesse sua Conta</h3>
                    <form id="form-login-ajax">
                        <div class="mb-2">
                            <label class="form-label small text-muted mb-1">E-mail / Usuário</label>
                            <input type="text" class="form-control form-control-sm" id="log-username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted mb-1">Senha</label>
                            <input type="password" class="form-control form-control-sm" id="log-senha" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-sm py-2">Entrar</button>
                            <button type="button" id="to-cadastro-btn" class="btn btn-outline-secondary btn-sm py-2">Não tenho conta</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container small">&copy; 2026 ClínicaOn. Todos os direitos reservados.</div>
    </footer>

    <!-- Script AJAX / Fetch -->
    <script>
        const boxCadastro = document.getElementById('box-cadastro');
        const boxLogin = document.getElementById('box-login');
        const toLoginBtn = document.getElementById('to-login-btn');
        const toCadastroBtn = document.getElementById('to-cadastro-btn');
        const formAlert = document.getElementById('form-alert');

        // Alternar visibilidade entre Cadastro e Login na mesma página
        toLoginBtn.addEventListener('click', () => {
            boxCadastro.classList.add('d-none');
            boxLogin.classList.remove('d-none');
            formAlert.classList.add('d-none');
        });

        toCadastroBtn.addEventListener('click', () => {
            boxLogin.classList.add('d-none');
            boxCadastro.classList.remove('d-none');
            formAlert.classList.add('d-none');
        });

        // AJAX Cadastro
        document.getElementById('form-cadastro-ajax').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const password = document.getElementById('cad-senha').value;

            try {
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password, username: email })
                });
                
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.token);
                    showAlert('Cadastro realizado com sucesso! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = data.redirect_url, 1500);
                } else {
                    // Exibe a mensagem de erro específica que veio da API no alerta da tela
                    const errorMsg = data.error || JSON.stringify(data);
                    showAlert('Erro: ' + errorMsg, 'danger');
                    console.error('Detalhes do erro da API:', data);
                }
            } catch (err) {
                showAlert('Erro de conexão com o servidor.', 'danger');
                console.error('Erro de rede:', err);
            }
        });

        // AJAX Login
        document.getElementById('form-login-ajax').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('log-username').value;
            const password = document.getElementById('log-senha').value;

            try {
                const response = await fetch('/api/session-login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showAlert('Login efetuado com sucesso! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = data.redirect_url, 1500);
                } else {
                    showAlert(data.error || 'Usuário ou senha inválidos.', 'danger');
                }
            } catch (err) {
                showAlert('Erro de conexão com o servidor.', 'danger');
            }
        });

        function showAlert(message, type) {
            formAlert.className = `alert alert-${type} py-2 small`;
            formAlert.textContent = message;
            formAlert.classList.remove('d-none');
        }
    </script>
</body>
</html>
