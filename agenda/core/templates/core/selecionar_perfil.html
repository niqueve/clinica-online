<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Selecione seu Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4 text-center" style="width: 450px;">
        <h3 class="mb-3">Como deseja se cadastrar?</h3>
        <p class="text-muted small mb-4">Escolha o seu perfil de acesso no sistema.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-grid gap-3">
                <button type="submit" name="tipo" value="PACIENTE" class="btn btn-outline-primary py-2">Sou Paciente <br><small class="text-muted">(Aprovação imediata)</small></button>
                <button type="submit" name="tipo" value="PROFISSIONAL" class="btn btn-outline-success py-2">Sou Profissional de Saúde <br><small class="text-muted">(Sujeito à avaliação)</small></button>
                <button type="submit" name="tipo" value="CLINICA" class="btn btn-outline-warning py-2">Representante de Clínica <br><small class="text-muted">(Sujeito à avaliação de documentos)</small></button>
            </div>
        </form>
    </div>
</body>
</html>
